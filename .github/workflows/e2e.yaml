name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  KUBERNETES_VERSION: v1.32.11
  KIND_CLUSTER_NAME: udev-manager-e2e
  ARTIFACT_ROOT: ${{ github.workspace }}/_artifacts/kind

jobs:
  kind-e2e:
    name: E2E - kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum

      - name: Install Kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) architecture=amd64 ;;
            aarch64|arm64) architecture=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          kind_url="https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${architecture}"
          curl -fsSLo kind "${kind_url}"
          curl -fsSLo kind.sha256sum "${kind_url}.sha256sum"
          echo "$(awk '{print $1}' kind.sha256sum)  kind" | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          kubectl_url="https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/${architecture}/kubectl"
          curl -fsSLo kubectl "${kubectl_url}"
          curl -fsSLo kubectl.sha256 "${kubectl_url}.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Prepare kernel device drivers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -q rdma-core "linux-modules-extra-$(uname -r)"
          sudo modprobe nbd nbds_max=8 max_part=8

          if sudo modprobe rdma_rxe; then
            echo "Using rdma_rxe for software RDMA devices"
          elif sudo modprobe siw; then
            echo "Using siw for software RDMA devices"
          else
            echo "Neither rdma_rxe nor siw is available in $(uname -r)" >&2
            exit 1
          fi

          sudo udevadm settle
          test -b /dev/nbd0

      - name: Run multi-node E2E scenarios
        run: make e2e

      - name: Upload E2E results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-e2e-logs
          path: _artifacts/
          if-no-files-found: ignore
