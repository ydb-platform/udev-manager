apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: device-lab
  namespace: udev-manager-e2e
spec:
  selector:
    matchLabels:
      app: device-lab
  template:
    metadata:
      labels:
        app: device-lab
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: device-lab
          image: udev-manager-device-lab:kind-e2e
          imagePullPolicy: Never
          command: [sleep, infinity]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-dev
              mountPath: /dev
            - name: host-sys
              mountPath: /sys
            - name: host-udev
              mountPath: /run/udev
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-udev
          hostPath:
            path: /run/udev
            type: DirectoryOrCreate
        - name: host-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/udev-manager-e2e
            type: DirectoryOrCreate
